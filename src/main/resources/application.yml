spring:
  profiles:
    active: dev
  servlet:
    multipart:
      enabled: true
      max-file-size: 1GB
      max-request-size: 1GB
  datasource:
    hikari:
      connection-timeout: 3000
      validation-timeout: 3000
      minimum-idle: 5
      max-lifetime: 240000
      maximum-pool-size: 20
      idle-timeout: 10000
  jpa:
    open-in-view: false
    #DB 대소문자 구분 시 @Table, @Column 에 입력한 name 으로 쿼리 전송 정책, DB가 대소문자 구분 때 추가
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    #Hibernate 6에서는 더 이상 구성 속성을 사용하여 방언을 명시적으로 지정할 필요가 없다.
    #https://docs.jboss.org/hibernate/orm/6.3/userguide/html_single/Hibernate_User_Guide.html#database-dialect
    #    database-platform: org.hibernate.dialect.OracleDialect
    #namedNativeQuery 사용 시 추가
  application:
    name: sideProjectApi

server:
  port: 9272
  error:
    path: /error
  servlet:
    context-path: /side-project-api
    encoding:
      charset: utf-8
      enabled: true
      force: true
springdoc: #https://springdoc.org/properties.html
  api-docs:
    path: /api-docs
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    doc-expansion: none #하위 operation 닫은 상태로 초기화
    display-operation-id: true
    filter: true
jwt:
  auth-key: side.project.key
jasypt:
  key: side-project-key
rsa:
  algorithm: RSA
  key-size: 2048
  private: 
  public: 
password:
  cycle: 30 #dsys
  locked: 3 #로그인 잠김 횟수햐
logging:
  config: classpath:logback/logback-spring.xml

